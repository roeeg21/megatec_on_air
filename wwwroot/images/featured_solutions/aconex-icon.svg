<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background -->
  <rect width="120" height="120" rx="20" fill="#C74634"/>

  <!-- Document/Files Stack representing document management -->
  <g fill="white">
    <!-- Back document -->
    <rect x="35" y="22" width="50" height="62" rx="4" fill="rgba(255,255,255,0.5)"/>
    <!-- Middle document -->
    <rect x="30" y="28" width="50" height="62" rx="4" fill="rgba(255,255,255,0.75)"/>
    <!-- Front document -->
    <rect x="25" y="34" width="50" height="62" rx="4"/>
  </g>

  <!-- Document lines -->
  <g stroke="#C74634" stroke-width="2" stroke-linecap="round">
    <line x1="33" y1="48" x2="60" y2="48"/>
    <line x1="33" y1="58" x2="55" y2="58"/>
    <line x1="33" y1="68" x2="65" y2="68"/>
    <line x1="33" y1="78" x2="50" y2="78"/>
  </g>

  <!-- Collaboration/Connection symbol -->
  <g transform="translate(70, 70)">
    <circle cx="15" cy="15" r="22" fill="white"/>
    <!-- Two people icon representing collaboration -->
    <circle cx="8" cy="10" r="5" fill="#C74634"/>
    <circle cx="22" cy="10" r="5" fill="#C74634"/>
    <path d="M2 28 Q8 20 14 28" fill="#C74634"/>
    <path d="M16 28 Q22 20 28 28" fill="#C74634"/>
    <!-- Connection arc -->
    <path d="M10 15 Q15 8 20 15" stroke="#C74634" stroke-width="2" fill="none"/>
  </g>
</svg>