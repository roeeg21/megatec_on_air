<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background -->
  <rect width="120" height="120" rx="20" fill="#C74634"/>

  <!-- Cloud Shape -->
  <g fill="white">
    <ellipse cx="55" cy="55" rx="28" ry="20"/>
    <ellipse cx="75" cy="50" rx="20" ry="16"/>
    <ellipse cx="40" cy="52" rx="18" ry="14"/>
    <ellipse cx="60" cy="62" rx="30" ry="18"/>
  </g>

  <!-- Connection dots representing cloud connectivity -->
  <g fill="#C74634">
    <circle cx="45" cy="52" r="4"/>
    <circle cx="60" cy="48" r="4"/>
    <circle cx="75" cy="52" r="4"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#C74634" stroke-width="2">
    <line x1="49" y1="52" x2="56" y2="48"/>
    <line x1="64" y1="48" x2="71" y2="52"/>
  </g>

  <!-- Upward arrow representing cloud upload/sync -->
  <path d="M60 70 L60 90 M52 82 L60 74 L68 82" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>